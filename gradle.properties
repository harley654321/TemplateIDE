# ===== PLANTILLA MAESTRA NATIVA 2026 — Kotlin/Java/Compose + AndroidIDE =====

# 0. ANDROIDIDE (no quitar — usa el aapt2 del sistema)
android.aapt2FromMavenOverride=/usr/bin/aapt2

# 1. MEMORIA (1536m si el teléfono tiene 4-6GB RAM; 2048m si tiene 8GB+)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 2. DAEMON (reciclaje entre builds/proyectos, auto-muerte en 1h)
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# 3. LOS 3 CACHÉS (build cache + configuration cache + file watching)
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# 4. PARALELO (si el teléfono se queda sin RAM, volver parallel a false)
org.gradle.parallel=true
org.gradle.configureondemand=true

# 5. KOTLIN (incremental + daemon propio + caché; ignoradas en proyectos Java puro)
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseParallelGC

# 6. ANDROID
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
